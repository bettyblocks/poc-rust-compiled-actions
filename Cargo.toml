[package]
name = "rust-actions"
version = "0.1.0"
edition = "2024"

[dependencies]
rquickjs = { version = "0.11.0", features = ["macro"], optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros"] }
rquickjs = { version = "0.11.0", features = ["macro", "futures"] }

[features]
javascript = ["dep:rquickjs"]
